[project]
name = "web-api-server"
version = "0.1.0"
description = "FastAPI app that serves the website and forwards translations to the gRPC server"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "grpcio>=1.84.0",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "pydantic>=2.14.0",
    "starlette>=1.7.0",
    "translate-proto",
    "utils",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
web-api-server = "web_api_server.main:main"

[tool.uv.sources]
translate-proto = { workspace = true }
utils = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
