[project]
name = "utils"
version = "0.1.0"
description = "Helpers shared across the workspace packages and services"
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.84.0",
    "grpcio-health-checking>=1.84.0",
    "python-dotenv>=1.1.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-grpc>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
    "sentry-sdk>=2.73.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
