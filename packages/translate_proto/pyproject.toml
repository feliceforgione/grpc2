[project]
name = "translate-proto"
version = "0.1.0"
description = "Generated gRPC code and shared helpers for the translation service"
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=7.36.2",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
