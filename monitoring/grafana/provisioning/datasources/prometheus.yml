# Grafana loads this on startup, so the Prometheus data source exists without
# setting it up in the UI. The fixed uid lets dashboards refer to it.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # The services push metrics every 60s (OTEL_METRIC_EXPORT_INTERVAL's
      # default), not every 15s scrape. Grafana sizes $__rate_interval from
      # this, to at least 4 samples, so rate() always has two to compare.
      timeInterval: 60s
