# Loki receives the services' logs over OTLP, at /otlp/v1/logs on port 3100,
# and keeps them on local disk for Grafana to query. It runs as a single
# process, and the compactor deletes logs older than the retention period.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  # A single Loki keeps one copy of each log, and its ring lives in memory.
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-10-30
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Keeps 14 days of logs, as Tempo does traces.
  retention_period: 14d

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
