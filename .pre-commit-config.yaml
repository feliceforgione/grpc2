# Runs the same checks as CI before every commit. Install the hook once with:
#   uv run pre-commit install
# Each hook runs against the whole workspace (not just staged files), using the
# tool versions pinned in uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        pass_filenames: false
        types: [python]

      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        pass_filenames: false
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
