# Runs the same checks as CI before every commit, and checks the commit message
# follows Conventional Commits. Install both hooks once with:
#   uv run pre-commit install
# Each hook runs against the whole workspace (not just staged files), using the
# tool versions pinned in uv.lock.
default_install_hook_types: [pre-commit, commit-msg]
# Hooks without their own `stages` run only before the commit, not again when
# the message is checked.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        pass_filenames: false
        types: [python]

      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        pass_filenames: false
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]

      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -r packages services tools -q
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true

      - id: jest
        name: website tests (jest)
        entry: npm --prefix services/web_api_server test
        language: system
        pass_filenames: false
        files: ^services/web_api_server/(src/web_api_server/website/|tests/js/|package(-lock)?\.json$)

      # Rejects messages that don't start with `<type>(<scope>): <summary>`.
      # The scope is optional and any scope is accepted. See .gitmessage.
      - id: conventional-commit
        name: conventional commit message
        entry: uv run conventional-pre-commit
        language: system
        stages: [commit-msg]
