name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Installs the Python version from .python-version and every workspace
      # package exactly as pinned in uv.lock.
      - run: uv sync --locked

      # Live tests (marked `live`) are skipped by default, so no OpenAI key is needed.
      - run: uv run pytest

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run mypy
