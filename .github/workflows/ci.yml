name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Installs the Python version from .python-version and every workspace
      # package exactly as pinned in uv.lock.
      - run: uv sync --locked

      # Live tests (marked `live`) are skipped by default, so no OpenAI key is needed.
      - run: uv run pytest

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run mypy

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff check

      - run: uv run ruff format --check

  website:
    name: Website tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web_api_server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/web_api_server/package-lock.json

      - run: npm ci

      - run: npm test

  # Lists the services whose image contents changed in this push: the service's
  # own folder, the shared packages, or the workspace's dependencies.
  changes:
    name: Find changed services
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            translate-grpc:
              - services/translate_grpc/**
              - packages/**
              - pyproject.toml
              - uv.lock
              - .dockerignore
            web-api-server:
              - services/web_api_server/**
              - packages/**
              - pyproject.toml
              - uv.lock
              - .dockerignore

  # Builds the changed services' images and pushes them to GHCR, only after
  # every other job passes, so only tested code is published.
  publish:
    name: Publish ${{ matrix.service }} image
    if: needs.changes.outputs.services != '[]'
    needs: [changes, test, typecheck, lint, website]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is what compose.yaml pulls; the commit SHA tag keeps every
      # build so a deploy can be rolled back to it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Service folders use underscores where the image names use hyphens.
          file: ${{ fromJSON('{"translate-grpc":"services/translate_grpc/Dockerfile","web-api-server":"services/web_api_server/Dockerfile"}')[matrix.service] }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Tells Coolify to redeploy once the new images are on GHCR. Skipped when no
  # image was published, because then there is nothing new to pull.
  deploy:
    name: Deploy to Coolify
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK_URL"
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
