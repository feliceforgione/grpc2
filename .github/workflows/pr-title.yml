name: PR title

# Squash merges use the PR title as the commit message on main, so it has to
# follow Conventional Commits too: `<type>(<scope>): <summary>`. The local
# commit-msg hook can't check it, since the title is set on GitHub.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
