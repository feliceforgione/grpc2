# Workspace root. It isn't a package itself; it ties the members together so
# `uv sync` installs everything into one .venv for local development and tests.
[project]
name = "translate"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Felice Forgione", email = "forgione67@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "translate-api",
    "translate-grpc",
    "translate-proto",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
translate-api = { workspace = true }
translate-grpc = { workspace = true }
translate-proto = { workspace = true }

[dependency-groups]
dev = [
    "grpc-stubs>=1.53.0.6",
    "grpcio-tools>=1.84.0",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.1.0",
    "ruff>=0.16.10",
]

[tool.poe.tasks.proto]
help = "Generate Python gRPC code from protos/ into the translate_proto package"
cmd = """
python -m grpc_tools.protoc -I protos
  --python_out=packages/translate_proto/src
  --pyi_out=packages/translate_proto/src
  --grpc_python_out=packages/translate_proto/src
  protos/translate_proto/translator.proto
"""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real OpenAI API (run with: pytest -m live)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.poe.tasks.typecheck]
help = "Type-check the whole workspace with mypy"
cmd = "mypy"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["packages", "services", "tests"]
mypy_path = [
    "packages/translate_proto/src",
    "services/translate_grpc/src",
    "services/translate_api/src",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["translate_proto.translator_pb2", "translate_proto.translator_pb2_grpc"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["deep_translator", "deep_translator.*", "googletrans", "googletrans.*"]
ignore_missing_imports = true

[tool.poe.tasks.format]
help = "Format the workspace with ruff"
cmd = "ruff format"

[tool.poe.tasks.lint]
help = "Lint the workspace with ruff"
cmd = "ruff check"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*_pb2.py", "*_pb2.pyi", "*_pb2_grpc.py", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["translate_api", "translate_grpc", "translate_proto"]
