# Runs both services and the monitoring stack. Coolify deploys this file as one
# resource and pulls the images that CI pushes to GHCR. There are no `build:`
# keys here, so Coolify never builds on the server; compose.local.yaml adds them
# for running locally. The monitoring images have their config built in, since
# Coolify doesn't put the repo's files on the server for bind mounts.

# Shared by health checks. timeout stays above the checks' own 3s request
# timeout, so a slow answer counts as unhealthy rather than being cut off by
# Docker. While the container starts, Docker checks every start_interval, so
# web-api-server isn't held up waiting a full interval for translate-grpc.
name: translate-grpc-project
x-healthcheck-timings: &healthcheck-timings
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 15s
  start_interval: 2s

services:
  web-api-server:
    image: ghcr.io/feliceforgione/grpc2/web-api-server:latest
    container_name: translate-web-api
    environment:
      TRANSLATE_GRPC_SERVER_ADDRESS: translate-grpc:${TRANSLATE_GRPC_SERVER_PORT:-50051}
      # Sends spans to Tempo's OTLP gRPC port on the compose network.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # Sends metrics to Prometheus's OTLP receiver, which accepts only HTTP.
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics
    # Only reachable through Coolify's proxy, which routes the domain to this port.
    expose:
      - "8000"
    # Wait until the gRPC server answers its health check
    depends_on:
      translate-grpc:
        condition: service_healthy
    # Calls GET /health; --fail exits non-zero on an error status. The port must
    # match WEB_API_SERVER_PORT in services/web_api_server/Dockerfile, like
    # `expose` above.
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "3",
          "http://127.0.0.1:8000/health",
        ]
      <<: *healthcheck-timings
    restart: unless-stopped
    labels:
      - "io.portainer.accesscontrol.teams=translate-grpc"

  translate-grpc:
    image: ghcr.io/feliceforgione/grpc2/translate-grpc:latest
    container_name: translate-grpc
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      TRANSLATE_GRPC_SERVER_PORT: ${TRANSLATE_GRPC_SERVER_PORT:-50051}
      # Sends spans to Tempo's OTLP gRPC port on the compose network.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # Sends metrics to Prometheus's OTLP receiver, which accepts only HTTP.
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics
    # Private: only the web API server reaches it, on the compose network.
    expose:
      - "${TRANSLATE_GRPC_SERVER_PORT:-50051}"
    # Calls the standard gRPC health service, which never reaches OpenAI.
    healthcheck:
      test: ["CMD", "translate-grpc-healthcheck"]
      <<: *healthcheck-timings
    restart: unless-stopped

  prometheus:
    image: ghcr.io/feliceforgione/grpc2/prometheus:latest
    container_name: translate-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      # Lets the services push metrics over OTLP instead of being scraped.
      - --web.enable-otlp-receiver
    volumes:
      - prometheus-data:/prometheus
    # Private: only the services push to it and Grafana queries it, on the
    # compose network.
    expose:
      - "9090"
    # The image has busybox wget, which exits non-zero on an error status.
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9090/-/ready",
        ]
      <<: *healthcheck-timings
    restart: unless-stopped

  tempo:
    image: ghcr.io/feliceforgione/grpc2/tempo:latest
    container_name: translate-tempo
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - tempo-data:/var/tempo
    # Private: the services send spans to 4317 (OTLP gRPC) or 4318 (OTLP HTTP),
    # and Grafana queries 3200, all on the compose network.
    expose:
      - "3200"
      - "4317"
      - "4318"
    # The image has no shell or curl, so it uses Tempo's own check of /ready.
    healthcheck:
      test: ["CMD", "/tempo", "-health"]
      <<: *healthcheck-timings
    restart: unless-stopped

  grafana:
    image: ghcr.io/feliceforgione/grpc2/grafana:latest
    container_name: translate-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3300"
    volumes:
      - grafana-data:/var/lib/grafana
    # Only reachable through Coolify's proxy, which routes a domain to this port.
    expose:
      - "3300"
    # The port must match GF_SERVER_HTTP_PORT above, like `expose`.
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "3",
          "http://127.0.0.1:3300/api/health",
        ]
      <<: *healthcheck-timings
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

# Named volumes keep the metrics, traces and Grafana's settings across redeploys.
volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
