# Runs both services. Coolify deploys this file as one resource and pulls the
# images that CI pushes to GHCR. There are no `build:` keys here, so Coolify
# never builds on the server; compose.local.yaml adds them for running locally.

services:
  web-api-server:
    image: ghcr.io/feliceforgione/grpc2/web-api-server:latest
    environment:
      TRANSLATE_GRPC_SERVER_ADDRESS: translate-grpc:50051
    # Only reachable through Coolify's proxy, which routes the domain to this port.
    expose:
      - "8000"
    depends_on:
      - translate-grpc
    restart: unless-stopped

  translate-grpc:
    image: ghcr.io/feliceforgione/grpc2/translate-grpc:latest
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
    # Private: only the web API server reaches it, on the compose network.
    expose:
      - "50051"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Private: only Grafana queries it, on the compose network.
    expose:
      - "9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3300"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    # Only reachable through Coolify's proxy, which routes a domain to this port.
    expose:
      - "3300"
    depends_on:
      - prometheus
    restart: unless-stopped

# Named volumes keep the metrics and Grafana's settings across redeploys.
volumes:
  prometheus-data:
  grafana-data:
