syntax = "proto3";

package translator.v1;

// When adding a language here, also add a matching member to the LanguageName
// StrEnum in packages/translate_proto/src/translate_proto/utils.py and regenerate.
enum Language {
    LANGUAGE_UNSPECIFIED = 0;
    LANGUAGE_ENGLISH = 1;
    LANGUAGE_ITALIAN = 2;
    LANGUAGE_SPANISH = 3;
    LANGUAGE_HUNGARIAN = 4;
    LANGUAGE_POLISH = 5;
    LANGUAGE_FRENCH = 6;
}

message TranslateRequest {
    string text = 1;
    Language language = 2;
}

message TranslateResponse {
    string translated_text = 1;
}

service Translation {
  rpc Translate (TranslateRequest) returns (TranslateResponse) {}
}
